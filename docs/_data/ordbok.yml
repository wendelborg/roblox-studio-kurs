- ord: Parent / Child
  forklaring: Forelder og barn i Explorer-treet. Klossen er forelder til skriptet som ligger inni den.
- ord: String
  forklaring: Tekst i anførselstegn, som "Hei!".
- ord: Variabel
  forklaring: En boks med navnelapp. Du legger noe oppi og bruker navnet etterpå.
- ord: Boolean
  forklaring: "Ja eller nei: true eller false."
- ord: Anchored
  forklaring: Festet med en usynlig spiker. En kloss som er Anchored, faller ikke ned.
- ord: Hendelse (event)
  forklaring: En dørklokke som koden venter på, for eksempel Touched.
- ord: Betingelse
  forklaring: Et ja/nei-spørsmål med if.
- ord: Løkke
  forklaring: Noe som gjentas, som refrenget i en sang.
- ord: Funksjon
  forklaring: En oppskrift med navn som du kan bruke mange ganger.
- ord: Parameter
  forklaring: Ingrediensen du sender inn i oppskriften.
- ord: Attributt
  forklaring: En lapp med navn og verdi som du klistrer på en spiller eller en ting, for eksempel HarDen = true.
- ord: Debounce
  forklaring: En vakt som hindrer at ting skjer for mange ganger.
